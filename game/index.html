          o.frequency.exponentialRampToValueAtTime(rand(110, 140), now + 2.4);
          const lfo = ctx.createOscillator(); lfo.frequency.value = 5.2;
          const lg = ctx.createGain(); lg.gain.value = 6;
          lfo.connect(lg); lg.connect(o.frequency);
          const g = ctx.createGain();
          g.gain.setValueAtTime(0.0001, now);
          g.gain.exponentialRampToValueAtTime(0.028, now + 0.7);
          g.gain.exponentialRampToValueAtTime(0.0001, now + 2.6);
          g.connect(master); o.connect(g);
          o.start(now); lfo.start(now); o.stop(now + 2.7); lfo.stop(now + 2.7);

  const pentFreq = i => 523.25 * Math.pow(2, PENT[i % 5] / 12) * Math.pow(2, Math.min(Math.floor(i / 5), 2));
  return {
    unlock, resume, suspend, setMuted, setPlatformMuted,
    state() { return ctx ? ctx.state : "none"; },
    /* returns a MediaStream of the game mix (used by the trailer capture harness) */
    captureStream() {

        const dest = ctx.createMediaStreamDestination();
        comp.connect(dest);

    duckAmbience(level) {

      if (Math.abs(target - lastDuck) < 0.002) return;
      lastDuck = target;

    },
    pop(chain, tier, x) {
      const f = pentFreq(chain) * detune();
      const g = 0.16 + Math.min(tier, 8) * 0.008;
      const pan = x !== undefined ? panOf(x) : 0;
      osc("triangle", f, f * 1.02, 0.18, g, { pan });
      osc("sine", f * 2, f * 2, 0.1, g * 0.4, { pan });
      if (tier >= 5) osc("sine", f * 0.5, f * 0.5, 0.22, g * 0.5, { pan });

    thud(v, tier, x) {
      const now = performance.now();
      if (now - lastThud < 45) return;
      lastThud = now;
      const big = tier || 0;
      const f0 = (150 - big * 9) * detune();
      const pan = x !== undefined ? panOf(x) : 0;
      osc("sine", f0, f0 * 0.5, 0.11 + big * 0.008, 0.1 * v + 0.02 + big * 0.006, { pan });
      noise(0.05, 0.045 * v, 420, "lowpass", pan);
    },
    plip() { osc("sine", 340 * detune(), 420, 0.05, 0.05); },
    ui() { osc("sine", 660, 720, 0.05, 0.06); },
    dangerTick(warn) {
      const now = performance.now();
      const w = clamp(warn || 0.4, 0, 1);
      if (now - lastTick < lerp(700, 260, w)) return;
      lastTick = now;
      const g = lerp(0.05, 0.09, w);
      osc("sine", 233, 220, 0.14, g);
      osc("sine", 466, 440, 0.1, g * 0.4);
      noise(0.015, 0.03, 1400, "highpass");
    },
    whaleBirth() {
      if (!ctx || !unlocked) return;
      const t0 = ctx.currentTime;
      [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => {
        osc("triangle", f, f, 0.3, 0.14, { at: t0 + i * 0.09 });
        osc("sine", f * 2, f * 2, 0.2, 0.05, { at: t0 + i * 0.09 });
      });
      noise(0.6, 0.05, 5000, "highpass");
    },
    newBest() {
      if (!ctx || !unlocked) return;
      const t0 = ctx.currentTime;
      [659.25, 783.99, 1046.5].forEach((f, i) =>
        osc("triangle", f, f * 1.01, 0.22, 0.12, { at: t0 + i * 0.08 }));
    },
    over() {
      if (!ctx || !unlocked) return;
      const t0 = ctx.currentTime;
      [392, 329.63, 261.63, 196].forEach((f, i) =>
        osc("triangle", f, f * 0.99, 0.3, 0.1, { at: t0 + i * 0.17 }));
      osc("sine", 70, 40, 0.9, 0.12);
    },
    popSmall(i) {
      const f = pentFreq(i) * detune();
      osc("sine", f, f * 1.06, 0.07, 0.05);
    },
  };
})();

const Ads = (() => {

  let interstitialCount = 0, lastInterstitial = 0, runs = 0, runStartAt = 0;

    const pk = x => /(^|\.)poki\.com$/.test(x) || /(^|\.)poki-gdn\.com$/.test(x);

    return null;
  }
  function loadScript(src) {

      const s = document.createElement("script");
      s.src = src; s.onload = res; s.onerror = rej;
      document.head.appendChild(s);
    });
  }
  function detect() {
    try {
      if (window.PokiSDK) { kind = "poki"; sdk = window.PokiSDK; }
      else if (window.CrazyGames && window.CrazyGames.SDK) { kind = "crazygames"; sdk = window.CrazyGames.SDK; }
      else if (typeof window.adBreak === "function") { kind = "h5"; }
    } catch (e) { }
    log("detected:", kind);
  }
  async function init() {
    detect();
    // bootstrap the portal SDK when we can tell where we are but the SDK isn't present
    if (kind === "none") {
      const portal = portalParam || hostPortal();
      try {
        if (portal === "crazygames") await loadScript("https://sdk.crazygames.com/crazygames-sdk-v3.js");
        else if (portal === "poki") await loadScript("https://game-cdn.poki.com/scripts/v2/poki-sdk.js");
      } catch (e) { log("sdk load failed"); }
      detect();
    }
    try {
      if (kind === "poki") {
        await sdk.init();
        inited = true;
        try { sdk.gameLoadingFinished(); } catch (e) { }
        log("poki ready");
      } else if (kind === "crazygames") {
        await sdk.init(); // v3 hard-requires init before any module call
        inited = true;
        try { sdk.game.loadingStart(); sdk.game.loadingStop(); } catch (e) { }
        try { adblocked = await sdk.ad.hasAdblock(); } catch (e) { }
        // portal mute button: takes priority over the in-game sound setting
        try {
          sdk.game.addSettingsChangeListener(s => { try { SFX.setPlatformMuted(!!(s && s.muteAudio)); } catch (e) { } });
          if (sdk.game.settings && sdk.game.settings.muteAudio) SFX.setPlatformMuted(true);
        } catch (e) { }

      } else if (kind === "h5") {

        inited = true;
      } else inited = true;
    } catch (e) { inited = true; log("init error", e); }
    // backfill: the first run started while the SDK was still initializing
    try {
      if (typeof Game !== "undefined" && Game.state === "play" && !document.hidden) {
        if (kind === "crazygames") sdk.game.gameplayStart();
        else if (kind === "poki") sdk.gameplayStart();
      }
    } catch (e) { }
  }
  function muteForAd(on) { SFX.setMuted(on || !S.sound); Game.adPause(on); }
  const effectiveKind = () => (inited && !adblocked ? kind : (kind === "none" ? "none" : "blocked"));
  return {
    init,
    get kind() { return kind; },
    get standalone() { return kind === "none" && window.top === window; },
    runStarted() { runs++; runStartAt = Date.now(); },
    gameplayStart() {
      try {
        if (kind === "poki" && inited) sdk.gameplayStart();

      } catch (e) { }
      log("gameplayStart");
    },
    gameplayStop() {

      log("gameplayStop");
    },
    syncSound() {

    },
    /* interstitial: run-end transitions only, max 2/session, >=150s apart, never before run 2,

    maybeInterstitial(placement, done) {
      const now = Date.now();
      const runDur = runStartAt ? now - runStartAt : 0;
      const ok = effectiveKind() !== "none" && effectiveKind() !== "blocked" &&
        interstitialCount < 2 && runs >= 2 &&
        (now - lastInterstitial > 150000) && (now - sessionStart > 120000) &&
        runDur >= 30000 &&
        !(IAP.enabled && IAP.owns("noads"));
      log("interstitial?", placement, ok);
      if (!ok) { done(); return; }
      const consume = () => { interstitialCount++; lastInterstitial = Date.now(); };
      try {
        if (kind === "poki") {
          consume(); // commercialBreak has no fill signal; count optimistically
          muteForAd(true);
          sdk.commercialBreak().then(() => { muteForAd(false); done(); })
            .catch(() => { muteForAd(false); done(); });
        } else if (kind === "crazygames") {
          muteForAd(true);
          sdk.ad.requestAd("midgame", {
            adStarted: () => consume(), // budget burns only on actual fill
            adFinished: () => { muteForAd(false); done(); },
            adError: () => { muteForAd(false); done(); },
          });
        } else if (kind === "h5") {
          window.adBreak({
            type: "next", name: placement,
            beforeAd: () => { consume(); muteForAd(true); },
            afterAd: () => muteForAd(false),
            adBreakDone: () => { muteForAd(false); done(); }, // single completion path (fires with or without fill)
          });
        } else done();
      } catch (e) { muteForAd(false); done(); }
    },
    /* rewarded: granted free when standalone or ad path unavailable */
    rewarded(placement, onReward, onFail) {
      log("rewarded", placement);

      try {
        if (kind === "poki" && inited) {
          muteForAd(true);
          sdk.rewardedBreak().then(ok => { muteForAd(false); ok ? onReward() : free(); }) // no-fill must never be a dead button
            .catch(() => { muteForAd(false); free(); });
        } else if (kind === "crazygames" && inited) {
          if (adblocked) { free(); return; } // CG QA: game must stay playable under adblock
          muteForAd(true);
          sdk.ad.requestAd("rewarded", {
            adStarted: () => { }, adFinished: () => { muteForAd(false); onReward(); },
            adError: () => { muteForAd(false); free(); },
          });
        } else if (kind === "h5") {
          let settled = false;
          window.adBreak({
            type: "reward", name: placement,
            beforeAd: () => muteForAd(true), afterAd: () => muteForAd(false),
            beforeReward: showAdFn => showAdFn(),
            adViewed: () => { settled = true; onReward(); },
            adDismissed: () => { settled = true; onFail && onFail(); },

              muteForAd(false);

            },
          });
        } else free(); // standalone: free
      } catch (e) { free(); }
    },

  };
})();

/* ---------------- canvas setup ---------------- */
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d", { alpha: false, desynchronized: true });
let DPR = 1, VW = 0, VH = 0;
let L = null; // layout

function layout() {
  DPR = clamp(window.devicePixelRatio || 1, 1, LOWQ ? 1 : 2);
  VW = window.innerWidth; VH = window.innerHeight;
  canvas.width = Math.round(VW * DPR);
  canvas.height = Math.round(VH * DPR);
  canvas.style.width = VW + "px";
  canvas.style.height = VH + "px";
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

  const mb = document.getElementById("btnMute");
  const safeTop = mb ? Math.max(10, mb.getBoundingClientRect().top) : 10;
  const sab = document.getElementById("sabProbe");
  const safeBottom = sab ? sab.offsetHeight : 0;
  const hudTop = safeTop + 48;
  const botBar = 40 + safeBottom;
  const dropZone = 62;
  const availH = VH - hudTop - botBar - 6;
  let ch = availH - dropZone;
  let cw = Math.min(VW - 14, 500, ch * 0.85);
  ch = Math.min(ch, cw * 1.35);
  cw = Math.max(cw, 140); ch = Math.max(ch, 160);
  const x0 = (VW - cw) / 2;
  const yFloor = VH - botBar - 6;
  const yTop = yFloor - ch;
  const old = L;
  L = {
    cw, ch, x0, x1: x0 + cw, yFloor, yTop, hudTop, safeTop, safeBottom,
    scale: cw / 420,
    dropY: yTop - 26,
    wallTop: yTop - 34,
  };
  // rescale existing bodies (positions, radii, velocities AND interpolation state)
  if (old && Game.creatures) {
    const kx = cw / old.cw;
    for (const c of Game.creatures) {
      c.x = L.x0 + (c.x - old.x0) * kx;
      c.y = L.yFloor - (old.yFloor - c.y) * kx;
      c.px = c.x; c.py = c.y;
      c.vx *= kx; c.vy *= kx;
      c.r = TIERS[c.tier].f * cw;
      c.m = c.r * c.r; c.im = 1 / c.m;
    }
    Game.rescaleHeld();
  }
  Sprites.clear();
  Bg.rebuild();
}

/* ---------------- sprite cache (creature bodies + glow, no face) ---------------- */
const Sprites = (() => {
  const cache = new Map();
  function clear() { cache.clear(); }
  function key(tier, r) { return tier + "_" + Math.round(r * 2); }
  function get(tier, r) {
    const k = key(tier, r);
    let s = cache.get(k);
    if (!s) { s = build(tier, r); cache.set(k, s); }
    return s;
  }
  function build(tier, r) {
    const pad = r * 0.95;
    const size = Math.ceil((r + pad) * 2 * DPR);
    const t = TIERS[tier];
    const cx = (r + pad), cy = (r + pad);
    // halo canvas — drawn with 'lighter' at render time so bioluminescence sums in piles
    const hv = document.createElement("canvas");
    hv.width = size; hv.height = size;
    const hg = hv.getContext("2d");
    hg.scale(DPR, DPR);
    const glow = hg.createRadialGradient(cx, cy, r * 0.45, cx, cy, r * 1.85);
    glow.addColorStop(0, hexA(t.glow, 0.30));
    glow.addColorStop(0.55, hexA(t.glow, 0.11));
    glow.addColorStop(1, hexA(t.glow, 0));
    hg.fillStyle = glow;
    hg.beginPath(); hg.arc(cx, cy, r * 1.85, 0, TAU); hg.fill();
    // body canvas
    const cv = document.createElement("canvas");
    cv.width = size; cv.height = size;
    const g = cv.getContext("2d");
    g.scale(DPR, DPR);
    const bg = g.createRadialGradient(cx - r * 0.35, cy - r * 0.4, r * 0.1, cx, cy, r * 1.05);
    bg.addColorStop(0, t.hi);
    bg.addColorStop(0.72, mix(t.hi, t.lo, 0.55));
    bg.addColorStop(1, t.lo);
    g.fillStyle = bg;
    g.beginPath(); g.arc(cx, cy, r, 0, TAU); g.fill();
    // rim light
    g.strokeStyle = hexA("#ffffff", 0.35);
    g.lineWidth = Math.max(1, r * 0.05);
    g.beginPath(); g.arc(cx, cy, r * 0.92, -TAU * 0.42, -TAU * 0.08); g.stroke();
    // inner glow core
    const core = g.createRadialGradient(cx, cy + r * 0.1, 0, cx, cy, r * 0.75);
    core.addColorStop(0, hexA(t.glow, 0.5));
    core.addColorStop(1, hexA(t.glow, 0));
    g.fillStyle = core;
    g.beginPath(); g.arc(cx, cy, r * 0.75, 0, TAU); g.fill();
    accessory(g, tier, cx, cy, r, t);
    return { cv, hv, pad, r };
  }
  function accessory(g, tier, cx, cy, r, t) {
    g.save();
    // tier glow color at high alpha: accessories must carry identity at small radii
    g.strokeStyle = mix(t.glow, "#ffffff", 0.45);
    g.globalAlpha = 0.85;
    g.fillStyle = mix(t.glow, "#ffffff", 0.35);
    g.lineWidth = Math.max(1.5, r * 0.09); g.lineCap = "round";
    switch (tier) {
      case 0: // plankton: cilia
        for (let i = 0; i < 6; i++) {
          const a = i / 6 * TAU + 0.4;
          g.beginPath();
          g.moveTo(cx + Math.cos(a) * r * 1.02, cy + Math.sin(a) * r * 1.02);
          g.lineTo(cx + Math.cos(a) * r * 1.3, cy + Math.sin(a) * r * 1.3);
          g.stroke();
        }
        break;
      case 1: // krill: antennae + tail
        g.beginPath(); g.moveTo(cx - r * 0.3, cy - r * 0.85); g.quadraticCurveTo(cx - r * 0.7, cy - r * 1.5, cx - r * 1.1, cy - r * 1.35); g.stroke();
        g.beginPath(); g.moveTo(cx + r * 0.3, cy - r * 0.85); g.quadraticCurveTo(cx + r * 0.7, cy - r * 1.5, cx + r * 1.1, cy - r * 1.35); g.stroke();
        arcs(g, cx, cy + r * 0.35, r * 0.55, 3, 0.5);
        break;
      case 2: // shrimp: segmented curved back + fan tail + antennae
        for (let i = 0; i < 3; i++) {
          g.beginPath();
          g.arc(cx - r * 0.1, cy + r * 0.15, r * (0.55 + i * 0.16), -TAU * 0.38, -TAU * 0.06);
          g.stroke();
        }
        g.beginPath();
        g.moveTo(cx - r * 0.85, cy + r * 0.4);
        g.lineTo(cx - r * 1.3, cy + r * 0.15);
        g.moveTo(cx - r * 0.85, cy + r * 0.4);
        g.lineTo(cx - r * 1.32, cy + r * 0.5);
        g.moveTo(cx - r * 0.85, cy + r * 0.4);
        g.lineTo(cx - r * 1.25, cy + r * 0.85);
        g.stroke();
        g.beginPath(); g.moveTo(cx + r * 0.55, cy - r * 0.65); g.quadraticCurveTo(cx + r * 1.25, cy - r * 1.15, cx + r * 1.55, cy - r * 0.65); g.stroke();

function hexA(hex, a) {

/* ---------------- background (bubbles, volumetric rays, dust) — gradients cached ---------------- */
const Bg = (() => {
  let bubbles = [], dust = [];
  let bgGrad = null, rayCv = null, builtTheme = -1;
  function rebuild() {
    bubbles = []; dust = [];
    const n = Math.round(VW * VH / (LOWQ ? 90000 : 42000));
    for (let i = 0; i < n; i++) bubbles.push(spawnBubble(true));
    for (let i = 0; i < n * 2; i++) dust.push({ x: rand(0, VW), y: rand(0, VH), r: rand(0.5, 1.6), a: rand(0.04, 0.14), s: rand(2, 8) });
    bgGrad = null; rayCv = null; builtTheme = -1;
  }
  function buildStatics(g, theme, themeIdx) {
    bgGrad = g.createLinearGradient(0, 0, 0, VH);
    bgGrad.addColorStop(0, theme.bgTop);
    bgGrad.addColorStop(1, theme.bgBot);
    // one volumetric ray pre-rendered: soft across its width, fading down its length
    const w = Math.max(60, VW * 0.3);
    rayCv = document.createElement("canvas");
    rayCv.width = Math.ceil(w); rayCv.height = Math.ceil(VH);
    const rg = rayCv.getContext("2d");
    const across = rg.createLinearGradient(0, 0, w, 0);
    across.addColorStop(0, theme.ray + "0)");
    across.addColorStop(0.5, theme.ray + "0.09)");
    across.addColorStop(1, theme.ray + "0)");
    rg.fillStyle = across;
    rg.fillRect(0, 0, w, VH);
    // vertical falloff
    const down = rg.createLinearGradient(0, 0, 0, VH);
    down.addColorStop(0, "rgba(0,0,0,0)");
    down.addColorStop(0.75, "rgba(0,0,0,0.75)");
    down.addColorStop(1, "rgba(0,0,0,1)");
    rg.globalCompositeOperation = "destination-out";
    rg.fillStyle = down;
    rg.fillRect(0, 0, w, VH);
    builtTheme = themeIdx;
  }
  function spawnBubble(anywhere) {
    return { x: rand(0, VW), y: anywhere ? rand(0, VH) : VH + 10, r: rand(1.5, 5), s: rand(14, 42), w: rand(0.4, 1.4), p: rand(0, TAU) };
  }
  function update(dt) {
    for (const b of bubbles) {
      b.y -= b.s * dt; b.p += dt * b.w;
      if (b.y < -12) Object.assign(b, spawnBubble(false));
    }
    for (const d of dust) { d.y -= d.s * dt * 0.3; if (d.y < -4) { d.y = VH + 4; d.x = rand(0, VW); } }
  }
  function draw(g, t, theme, themeIdx) {
    if (!bgGrad || builtTheme !== themeIdx) buildStatics(g, theme, themeIdx);
    g.fillStyle = bgGrad;
    g.fillRect(0, 0, VW, VH);
    // god rays: blit the cached strip 3x with slow sway + skew
    g.save();
    g.globalCompositeOperation = "lighter";
    for (let i = 0; i < 3; i++) {
      const sway = Math.sin(t * 0.00013 + i * 2.1) * VW * 0.07;
      const x = VW * (0.12 + i * 0.32) + sway;
      g.setTransform(DPR, 0, DPR * 0.22, DPR, x * DPR, 0); // slight shear = slanted light
      g.globalAlpha = 0.8 + 0.2 * Math.sin(t * 0.0003 + i * 1.9);
      g.drawImage(rayCv, -rayCv.width / 2, 0);
    }
    g.setTransform(DPR, 0, 0, DPR, 0, 0);
    g.globalAlpha = 1;
    // dust
    g.fillStyle = "rgba(140,200,255,0.5)";
    for (const d of dust) { g.globalAlpha = d.a; g.beginPath(); g.arc(d.x, d.y, d.r, 0, TAU); g.fill(); }
    g.globalAlpha = 1;
    // bubbles
    for (const b of bubbles) {
      const x = b.x + Math.sin(b.p) * 6;
      g.globalAlpha = 0.14;
      g.strokeStyle = "#9fd8ff";
      g.lineWidth = 1;
      g.beginPath(); g.arc(x, b.y, b.r, 0, TAU); g.stroke();
    }
    g.globalAlpha = 1;
    g.restore();
  }
  return { rebuild, update, draw };
})();

/* ---------------- particles / floating text / shake ---------------- */
const Fx = (() => {
  const parts = [], floats = [], rings = [];
  let trauma = 0, flash = 0, flashColor = "#ffffff";
  function burst(x, y, color, n, speed, up) {
    for (let i = 0; i < n; i++) {
      const a = rand(0, TAU), sp = rand(speed * 0.3, speed);
      parts.push({
        x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - (up || 0),
        r: rand(1.5, 4.5), life: 1, decay: rand(1.6, 2.6), color,
      });
    }
  }
  function float(x, y, txt, size, color) {
    floats.push({ x, y, txt, size, color: color || "#bfeaff", life: 1 });
  }
  function ring(x, y, color, r0, r1, dur, lw) {
    rings.push({ x, y, color, r0, r1, dur: dur || 0.15, lw: lw || 3, t: 0 });
  }
  function doFlash(color, amt) { flash = Math.max(flash, amt); flashColor = color; }
  function shake(amt) { trauma = Math.min(1, trauma + amt); }
  function update(dt) {
    for (let i = parts.length - 1; i >= 0; i--) {
      const p = parts[i];
      p.x += p.vx * dt; p.y += p.vy * dt;
      p.vy -= 30 * dt; p.vx *= (1 - 1.6 * dt);
      p.life -= p.decay * dt;
      if (p.life <= 0) parts.splice(i, 1);
    }
    for (let i = floats.length - 1; i >= 0; i--) {
      const f = floats[i];
      f.y -= 46 * dt; f.life -= dt / 0.62;
      if (f.life <= 0) floats.splice(i, 1);
    }
    for (let i = rings.length - 1; i >= 0; i--) {
      rings[i].t += dt;
      if (rings[i].t >= rings[i].dur) rings.splice(i, 1);
    }
    flash = Math.max(0, flash - 3.2 * dt);
    trauma = Math.max(0, trauma - 1.4 * dt);
  }
  function offset(t) {
    const s = trauma * trauma;
    return {
      x: s * 13 * (Math.sin(t * 0.061) + Math.sin(t * 0.127) * 0.6),
      y: s * 13 * (Math.cos(t * 0.083) + Math.sin(t * 0.151) * 0.6),
      rot: s * 0.011 * Math.sin(t * 0.097),
    };
  }
  function draw(g) {
    g.save();
    g.globalCompositeOperation = "lighter";
    for (const p of parts) {
      g.globalAlpha = Math.max(0, p.life) * 0.9;
      g.fillStyle = p.color;
      g.beginPath(); g.arc(p.x, p.y, p.r * p.life, 0, TAU); g.fill();
    }
    for (const r of rings) {
      const k = r.t / r.dur;
      g.globalAlpha = (1 - k) * 0.8;
      g.strokeStyle = r.color;
      g.lineWidth = Math.max(0.5, r.lw * (1 - k));
      g.beginPath(); g.arc(r.x, r.y, lerp(r.r0, r.r1, easeOutCubic(k)), 0, TAU); g.stroke();
    }
    g.restore();
    g.globalAlpha = 1;
    for (const f of floats) {
      const t = 1 - f.life;
      g.globalAlpha = f.life < 0.3 ? f.life / 0.3 : 1;
      g.font = `800 ${f.size}px ui-rounded, "SF Pro Rounded", "Segoe UI", system-ui, sans-serif`;
      g.textAlign = "center";
      g.fillStyle = f.color;
      g.fillText(f.txt, f.x, f.y);
      g.save();
      g.globalCompositeOperation = "lighter";
      g.globalAlpha *= 0.45;
      g.fillText(f.txt, f.x, f.y);
      g.restore();
    }
    g.globalAlpha = 1;
  }
  function drawFlash(g) {
    if (flash <= 0.004) return;
    g.save();
    g.globalCompositeOperation = "lighter";
    g.globalAlpha = flash;
    g.fillStyle = flashColor;
    g.fillRect(0, 0, VW, VH);
    g.restore();
  }
  return { burst, float, ring, doFlash, drawFlash, shake, update, offset, draw, get count() { return parts.length; } };
})();

/* ---------------- game ---------------- */
const Game = (() => {
  /* physics tuning (research: restitution .2, friction .5 feel) */
  const SUB = 1 / 120, ITER = 6, REST = 0.20, WALL_REST = 0.1, SLOP = 0.4, CORR = 0.6;
  const REST_THRESH = 60;

  let creatures = [];
  let held = null, nextTier = 0, canDrop = false, dropTimer = 0;
  let aimX = null, aiming = false, hoverAim = false; // aimX null = never aimed (0 is a valid left-edge tap)
  let score = 0, combo = 0, comboAge = 0, maxCombo = 0, settledT = 0;
  let state = "play"; // play | dying | over | paused(ad)
  let dying = null;
  let dropCount = 0, runSeed = 0, rng = Math.random;
  let acc = 0, lastT = 0;
  let warnLevel = 0;
  let NOW = 0; // game clock in ms — advances ONLY while the sim runs (hard pause safe)
  let firstDropDone = false, hintT = 0, firstMergeDone = false;
  let usedContinue = false, usedDouble = false;
  let maxTierRun = 0;
  let adPaused = false;
  let doubled = false;
  let hitstopT = 0, scoreFlash = 0, heldSpawnT = 1;
  const ghosts = []; // merge-absorb animations
  let chainCv = null, chainMaxTier = -1, chainTheme = -1; // evolution bar cache
  let discovered = store.get("discovered", 3); // bitmask; tiers 0-1 known from start
  let slowFrames = 0, lowQuality = false; // adaptive quality
  let pausedRendered = false;
  let streakN = 0; // cached daily streak (no per-frame storage reads)
  let runIsDaily = false; // snapshotted at reset — mid-run toggles must not flip scoring attribution

  const themeIdx = () => clamp(S.theme, 0, THEMES.length - 1);

  function newCreature(tier, x, y, fromDrop) {
    const r = TIERS[tier].f * L.cw;
    return {
      tier, x, y, px: x, py: y, vx: 0, vy: 0, r,
      m: r * r, im: 1 / (r * r),
      angle: rand(-0.2, 0.2), va: 0,
      sq: 0, sqv: 0, sqAxis: 0,
      birth: NOW,
      drop: fromDrop ? NOW : 0,
      overT: 0, merging: false, dead: false,
      joyT: 0, blink: rand(1, 5), blinkT: 0,
      impactCd: 0, sleepT: 0, asleep: false,
      pop: fromDrop ? 1 : 0, // birth pop progress; 1 = no animation; negative = absorb delay
    };
  }

  function pickSpawnTier() {
    if (!firstDropDone && dropCount < 2) return 0; // engineered quick win
    const small = creatures.length < 5;
    const w = small ? [6, 5, 2, 0, 0] : [6, 5, 4, 3, 2];
    let tot = 0; for (const x of w) tot += x;
    let v = rng() * tot;
    for (let i = 0; i <= SPAWN_MAX; i++) { v -= w[i]; if (v <= 0) return i; }
    return 0;
  }

  function reset() {
    creatures = []; ghosts.length = 0; mergeQueue.length = 0;
    score = 0; combo = 0; comboAge = 0; maxCombo = 0; settledT = 0; dropCount = 0;
    usedContinue = false; usedDouble = false; doubled = false;
    maxTierRun = 0; warnLevel = 0; hitstopT = 0;
    state = "play"; dying = null;
    firstDropDone = false; hintT = 0; firstMergeDone = false;
    chainMaxTier = -1; // rebuild evolution bar
    runIsDaily = S.daily;
    if (runIsDaily) {
      runSeed = dayKey();
      rng = mulberry32(runSeed);
      // daily streak: consecutive days playing the daily challenge
      const st = store.get("streak", { last: 0, n: 0 });
      if (st.last !== dayKey()) {
        const y = new Date(); y.setDate(y.getDate() - 1);
        const yesterday = y.getFullYear() * 10000 + (y.getMonth() + 1) * 100 + y.getDate();
        st.n = st.last === yesterday ? st.n + 1 : 1;
        st.last = dayKey();
        store.set("streak", st);
      }
      streakN = st.n;
    } else rng = Math.random;
    nextTier = pickSpawnTier();
    spawnHeld();
    SFX.duckAmbience(0); // restore the ambience bed after a danger-heavy end
    S.games++; store.set("games", S.games);
    Ads.runStarted();
    Ads.gameplayStart();
  }

  function spawnHeld() {
    const tier = nextTier;
    nextTier = pickSpawnTier();
    const r = TIERS[tier].f * L.cw;
    held = { tier, r, x: aimX !== null ? clamp(aimX, L.x0 + r + 2, L.x1 - r - 2) : (L.x0 + L.x1) / 2, bob: 0 };

  }

    // spawn at the AIM point, not the lagged follow position — taps land where the finger is
    const r = held.r;

  /* ---------- physics ---------- */

  function step(h) {

    const n = creatures.length;

      const dx = b.x - a.x, dy = b.y - a.y;

        let d2 = dx * dx + dy * dy;
        const rs = a.r + b.r;

        if (d < 0.0001) { d = 0.0001; dx = 0.0001; dy = 0; }
        const nx = dx / d, ny = dy / d;
        const pen = rs - d;
        // positional correction (wakes sleepers when real displacement happens)
        if (pen > SLOP) {
          const corr = (pen - SLOP) * CORR / (a.im + b.im);
          a.x -= nx * corr * a.im; a.y -= ny * corr * a.im;
          b.x += nx * corr * b.im; b.y += ny * corr * b.im;

          if (corr > 0.35 || pen > SLOP * 2) { a.asleep = false; a.sleepT = 0; b.asleep = false; b.sleepT = 0; }
        }

        const rvx = b.vx - a.vx, rvy = b.vy - a.vy;
        const vn = rvx * nx + rvy * ny;

          const e = Math.abs(vn) > REST_THRESH * L.scale ? REST : 0;
          const j = -(1 + e) * vn / (a.im + b.im);
          a.vx -= j * a.im * nx; a.vy -= j * a.im * ny;
          b.vx += j * b.im * nx; b.vy += j * b.im * ny;

          // impact feedback (first iteration only)
          if (it === 0 && vn < -220 * L.scale) {

          c.x = L.x0 + c.r;
          if (c.vx < 0) c.vx = -c.vx * WALL_REST;

          if (c.vx > 0) c.vx = -c.vx * WALL_REST;
          c.va *= 0.96;
          if (iv > 300 * L.scale) wallImpact(c, clamp(iv / (1300 * L.scale), 0, 1));

        if (c.y + c.r > L.yFloor) {
          const impactV = c.vy;
          c.y = L.yFloor - c.r;
          if (c.vy > 0) c.vy = -c.vy * REST;
          c.vx *= 0.985; c.va *= 0.94;
          if (impactV > 260 * L.scale) {
            const v = clamp(impactV / (1300 * L.scale), 0, 1);
            landImpact(c, v);
          }
        }
      }
    }
    // NaN guard
    for (const c of creatures) {
      if (!isFinite(c.x) || !isFinite(c.y)) { c.x = (L.x0 + L.x1) / 2; c.y = L.yTop + 40; c.vx = c.vy = 0; }
      if (!isFinite(c.angle) || !isFinite(c.va)) { c.angle = 0; c.va = 0; }
    }
  }

  const mergeQueue = [];

  /* wake every sleeper in contact range of a removed body — prevents mid-air hover.
     One-hop flood: a sleeper resting solely on a woken neighbor must wake too. */
  function wakeAround(d) {
    const woken = [];
    for (const c of creatures) {
      if (c.dead || c === d) continue;
      const rr = c.r + d.r + 24 * L.scale;
      const dx = c.x - d.x, dy = c.y - d.y;
      if (dx * dx + dy * dy < rr * rr) {
        if (c.asleep) woken.push(c);
        c.asleep = false; c.sleepT = 0;
      }
    }
    for (const w of woken) {
      for (const c of creatures) {
        if (c.dead || c === w || !c.asleep) continue;
        const rr = c.r + w.r + 24 * L.scale;
        const dx = c.x - w.x, dy = c.y - w.y;
        if (dx * dx + dy * dy < rr * rr) { c.asleep = false; c.sleepT = 0; }
      }
    }
  }

  function impact(a, b, v, nx, ny) {
    const axis = Math.atan2(ny, nx); // squash along the contact normal
    if (a.impactCd <= 0) { a.impactCd = 0.06; squash(a, v * 0.5, axis + Math.PI / 2); }
    if (b.impactCd <= 0) { b.impactCd = 0.06; squash(b, v * 0.5, axis + Math.PI / 2); }
    const big = Math.max(a.tier, b.tier);
    SFX.thud(v, big, (a.x + b.x) / 2);
    if (v > 0.5 && big >= 3) {
      const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
      Fx.burst(mx, my, hexA("#9fd8ff", 0.8), 3, 60 * L.scale, 20);
    }
  }
  function landImpact(c, v) {
    if (c.impactCd > 0) return;
    c.impactCd = 0.06;
    SFX.thud(v * 0.8, c.tier, c.x);
    squash(c, v * 0.7, 0);
    if (v > 0.4) Fx.burst(c.x, L.yFloor - 3, "rgba(140,210,255,0.7)", Math.round(3 + v * 4), 50 * L.scale, 30);
  }
  function wallImpact(c, v) {
    if (c.impactCd > 0) return;
    c.impactCd = 0.06;
    SFX.thud(v * 0.6, c.tier, c.x);
    squash(c, v * 0.5, Math.PI / 2); // compress along X
  }
  function squash(c, k, axis) {
    c.sqv -= clamp(k, 0, 1) * 12;
    if (axis !== undefined) c.sqAxis = axis;
  }

  function processMerges() {
    while (mergeQueue.length >= 2) {
      const a = mergeQueue.shift(), b = mergeQueue.shift();
      if (a.dead || b.dead) { a.merging = b.merging = false; continue; }
      const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
      a.dead = b.dead = true;
      wakeAround(a); wakeAround(b); // neighbors must never keep sleeping on a hole
      // absorb ghosts: parents visibly pull into the midpoint for ~60ms
      ghosts.push({ tier: a.tier, ax: a.x, ay: a.y, bx: b.x, by: b.y, mx, my, t: 0, aAngle: a.angle, bAngle: b.angle });
      combo++;
      comboAge = 0; settledT = 0;
      if (combo > maxCombo) maxCombo = combo;
      S.merges++;
      const t = a.tier;
      const tt = TIERS[Math.min(t + 1, 10)];
      if (t >= 10) {
        // two whales: abyssal bonus
        addScore(100, mx, my, 30);
        Fx.burst(mx, my, tt.glow, 40, 260 * L.scale, 60);
        Fx.ring(mx, my, tt.glow, 10, L.cw * 0.6, 0.45, 14);
        Fx.doFlash("#ffffff", 0.12);
        Fx.shake(0.55);
        SFX.whaleBirth();
        vibe([40, 50, 80]);
        hitstopT = Math.max(hitstopT, 0.04);
      } else {
        const nc = newCreature(t + 1, mx, my, false);
        nc.vx = (a.vx + b.vx) * 0.25;
        nc.vy = (a.vy + b.vy) * 0.25 - 40 * L.scale;
        nc.pop = -0.28; // brief delay while parents absorb, then 0->1.2->1 pop
        nc.joyT = 0.7;
        creatures.push(nc);
        if (t + 1 > maxTierRun) maxTierRun = t + 1;
        firstMergeDone = true;
        addScore(PTS[t + 1], mx, my, 16 + (t + 1) * 1.2);
        discover(t + 1, mx, my);
        Fx.burst(mx, my, tt.glow, 8 + (t + 1) * 2.4, (110 + t * 22) * L.scale, 40);
        Fx.ring(mx, my, tt.glow, nc.r * 0.4, nc.r * 1.6, 0.15, 3);
        Fx.shake(Math.min(0.06 + (t + 1) * 0.045, 0.5));
        SFX.pop(combo - 1, t + 1, mx);
        vibe(combo >= 3 ? [30, 40, 60] : 30);
        if (t + 1 >= 7) hitstopT = Math.max(hitstopT, 0.04);
        if (t + 1 === 10) {
          SFX.whaleBirth(); Fx.shake(0.5); vibe([40, 50, 90]);
          Fx.ring(mx, my, tt.glow, 10, L.cw * 0.6, 0.45, 14);
          Fx.doFlash("#ffffff", 0.12);
        }
      }
      if (combo >= 3) {
        // fan consecutive combo texts out so mega-cascades never stack unreadably
        Fx.float(mx + rand(-30, 30), my - (30 + (combo - 3) * 18) * L.scale, T.combo + " ×" + combo, 15 + Math.min(combo, 8), "#ffd678");
      }
    }
    // purge dead
    for (let i = creatures.length - 1; i >= 0; i--) if (creatures[i].dead) creatures.splice(i, 1);
  }

  /* first-ever discovery of a species: name banner + persistence */
  function discover(tier, x, y) {
    const bit = 1 << tier;
    if (discovered & bit) return;
    discovered |= bit;
    store.set("discovered", discovered);
    Fx.float(clamp(x, 90, VW - 90), y - 52 * L.scale, (FR ? "Nouvelle espèce : " : "New species: ") + T.names[tier] + " !", 16, "#7fe0ff");
    SFX.newBest();
    vibe([20, 30, 40]);
  }

  function addScore(base, x, y, size) {
    const before = Math.max(score, S.best);
    score += base;
    scoreFlash = 1;
    Fx.float(x, y, "+" + base, size, "#bfeaff");
    checkUnlocks(before);
  }

  function checkUnlocks(before) {
    const now = Math.max(score, S.best);
    let mask = store.get("themesUnlocked", 1);
    for (let i = 1; i < THEMES.length; i++) {
      if (now >= THEMES[i].need && !(mask & (1 << i))) {
        mask |= 1 << i;
        store.set("themesUnlocked", mask);
        Fx.float(VW / 2, VH * 0.38, (FR ? "Ambiance débloquée : " : "Theme unlocked: ") + T.themes[i] + " !", 17, "#ffd678");
        SFX.newBest();
        vibe([20, 30, 40]);
        UI.menuBadge(true);
      }
    }
  }

  /* ---------- danger & game over ---------- */
  function dangerCheck(dtMs) {
    let maxOver = 0, anyNear = false;
    for (const c of creatures) {
      const top = c.y - c.r * 0.8;
      const violating = top < L.yTop &&
        (c.drop === 0 || NOW - c.drop > DROP_IMMUNE) &&
        (NOW - c.birth > BIRTH_IMMUNE);
      if (violating) c.overT += dtMs;
      else c.overT = Math.max(0, c.overT - dtMs * 2);
      if (c.overT > maxOver) maxOver = c.overT;
      if (top < L.yTop + 60 * L.scale) anyNear = true;
    }
    warnLevel = clamp(maxOver / GRACE_MS, 0, 1);
    if (anyNear && warnLevel < 0.25) warnLevel = 0.25;
    if (warnLevel > 0.3) SFX.dangerTick(warnLevel);
    SFX.duckAmbience(warnLevel);
    if (maxOver >= GRACE_MS && state === "play") gameOver();
  }

  function gameOver() {
    state = "dying";
    Ads.gameplayStop();
    SFX.over();
    vibe(120);
    Fx.shake(0.5);
    // board stays visible (near-miss retry fuel); panel fades in after 1200ms
    dying = { start: NOW, done: false };
  }

  function updateDying(dt) {
    if (!dying.done && NOW - dying.start > 1200) {
      dying.done = true;
      showOverPanel();
    }
  }

  function showOverPanel() {
    state = "over";
    const isDaily = runIsDaily;
    let isNew = false;
    if (isDaily) {
      if (S.dailyBest.day !== dayKey()) S.dailyBest = { day: dayKey(), score: 0 };
      if (score > S.dailyBest.score) { S.dailyBest.score = score; isNew = true; }
      store.set("dailyBest", S.dailyBest);
    } else {
      if (score > S.best) { S.best = score; isNew = true; store.set("best", S.best); }
    }
    store.set("merges", S.merges);
    if (isNew && score > 0) SFX.newBest();
    UI.showGameOver(score, isDaily ? S.dailyBest.score : S.best, isNew, usedContinue, usedDouble);
    UI.maybeIOSHint();
  }

  function doContinue() {
    usedContinue = true;
    const cutoff = L.yTop + L.ch * 0.45;
    let d = 0;
    for (const c of [...creatures]) {
      if (c.y < cutoff) {
        const j = d; // capture: rising pentatonic run, not N copies of the last pitch
        setTimeout(() => {
          c.dead = true;
          const idx = creatures.indexOf(c);
          if (idx >= 0) creatures.splice(idx, 1);
          wakeAround(c);
          Fx.burst(c.x, c.y, TIERS[c.tier].glow, 8, 140 * L.scale, 30);
          SFX.popSmall(j);
        }, d * 40);
        d++;
      }
    }
    for (const c of creatures) c.overT = 0;
    state = "play";
    dying = null;
    if (!held) spawnHeld();
    Ads.gameplayStart();
  }

  function doubleScore() {
    usedDouble = true; doubled = true;
    score *= 2;
    let isNew = false;
    if (runIsDaily) {
      if (score > S.dailyBest.score) { S.dailyBest.score = score; store.set("dailyBest", S.dailyBest); isNew = true; }
    } else if (score > S.best) { S.best = score; store.set("best", S.best); isNew = true; }
    UI.refreshOverScore(score, runIsDaily ? S.dailyBest.score : S.best, isNew);
    checkUnlocks(0); // a x2 that crosses a theme threshold toasts now, not next run
    if (isNew) SFX.newBest(); else SFX.ui();
  }

  /* ---------- frame ---------- */
  function frame(t) {
    requestAnimationFrame(frame);
    tick(t);
  }
  function tick(t) {
    if (!lastT) { lastT = t; return; }
    let dt = (t - lastT) / 1000;
    lastT = t;
    if (dt > 0.05) dt = 0.05;
    // adaptive quality: sustained slow frames -> drop DPR to 1, thin ambient particles
    if (dt > 0.024) { slowFrames++; } else if (slowFrames > 0) slowFrames--;
    if (slowFrames > 60 && !lowQuality) {
      lowQuality = true; LOWQ = true;
      layout();
    }
    if (adPaused) {
      if (!pausedRendered) { render(t, 0); pausedRendered = true; } // one frame, then let the GPU sleep behind the blur
      return;
    }
    pausedRendered = false;
    NOW += dt * 1000; // game clock: frozen during ad/menu pause so immunity timers stay fair
    if (hitstopT > 0) { hitstopT -= dt; Fx.update(dt); render(t, acc / SUB); return; }

    // input-follow for held
    if (held) {
      const target = clamp(aimX !== null ? aimX : held.x, L.x0 + held.r + 2, L.x1 - held.r - 2);
      held.x = lerp(held.x, target, 1 - Math.pow(0.000000001, dt));
      held.bob += dt;
    }
    if (heldSpawnT < 1) heldSpawnT = Math.min(1, heldSpawnT + dt / 0.18);
    if (!canDrop && state === "play" && !held) {
      dropTimer -= dt;
      if (dropTimer <= 0) spawnHeld();
    }
    if (!firstDropDone) hintT += dt;

    // physics
    if (state === "play" || state === "dying") {
      acc += dt;
      let steps = 0;
      while (acc >= SUB && steps < 10) {
        step(SUB);
        processMerges();
        acc -= SUB; steps++;
      }
    }
    // combo resets when the board has actually settled (not a blind timer)
    if (combo > 0) {
      comboAge += dt;
      let allSettled = true;
      for (const c of creatures) {
        if (!c.asleep && (c.vx * c.vx + c.vy * c.vy) > REST_THRESH * REST_THRESH * L.scale * L.scale) { allSettled = false; break; }
      }
      if (allSettled) settledT += dt; else settledT = 0;
      if (settledT > 0.3 || comboAge > 4) combo = 0;
    }
    // merge-absorb ghosts
    for (let i = ghosts.length - 1; i >= 0; i--) {
      ghosts[i].t += dt;
      if (ghosts[i].t > 0.06) ghosts.splice(i, 1);
    }
    if (scoreFlash > 0) scoreFlash = Math.max(0, scoreFlash - dt / 0.15);
    // springs & faces (spring integrated in <=16ms slices: stable even at the 50ms dt clamp)
    for (const c of creatures) {
      let sdt = dt;
      while (sdt > 0.0001) {
        const h2 = Math.min(sdt, 1 / 60);
        c.sqv += (-900 * c.sq - 36 * c.sqv) * h2;
        c.sq += c.sqv * h2;
        sdt -= h2;
      }
      c.sq = clamp(c.sq, -0.42, 0.42);
      if (c.pop < 1) c.pop = Math.min(1, c.pop + dt / 0.2);
      if (c.joyT > 0) c.joyT -= dt;
      c.blinkT -= dt;
      if (c.blinkT < -0.12) { c.blink = rand(2, 6); c.blinkT = c.blink; }
    }
    if (state === "play") dangerCheck(dt * 1000);
    if (state === "dying") updateDying(dt);

    Bg.update(dt);
    Fx.update(dt);
    render(t, acc / SUB);
  }

  /* ---------- render ---------- */
  function render(t, alpha) {
    const theme = THEMES[themeIdx()];
    const off = Fx.offset(t);
    Bg.draw(ctx, t, theme, themeIdx());
    ctx.save();
    ctx.translate(VW / 2 + off.x, VH / 2 + off.y);
    ctx.rotate(off.rot);
    ctx.translate(-VW / 2, -VH / 2);

    drawContainer(theme, t);
    // pass 1: all halos additively — bioluminescence sums through the pile
    ctx.save();
    ctx.globalCompositeOperation = "lighter";
    for (const c of creatures) {
      if (LOWQ && c.r < 11) continue; // low-quality mode: skip tiny halos, keep the big glow
      const ix = lerp(c.px, c.x, alpha), iy = lerp(c.py, c.y, alpha);
      const spr = Sprites.get(c.tier, c.r);
      const d = spr.r + spr.pad;
      const breathe = 0.82 + 0.18 * Math.sin(t * 0.0021 + c.birth % 1000);
      ctx.globalAlpha = LOWQ ? breathe * 0.7 : breathe;
      ctx.drawImage(spr.hv, ix - d, iy - d, d * 2, d * 2);
    }
    ctx.restore();
    ctx.globalAlpha = 1;
    // merge-absorb ghosts (parents pulling into the midpoint)
    for (const gh of ghosts) drawGhost(ctx, gh);
    // pass 2: bodies + faces
    for (const c of creatures) {
      const ix = lerp(c.px, c.x, alpha), iy = lerp(c.py, c.y, alpha);
      drawCreature(ctx, c, ix, iy, t);
    }
    drawDangerLine(theme, t);
    drawHeld(t);
    Fx.draw(ctx);
    ctx.restore();
    drawHud(theme, t);
    Fx.drawFlash(ctx);
  }

  function drawGhost(g, gh) {
    const k = gh.t / 0.06;
    const spr = Sprites.get(gh.tier, TIERS[gh.tier].f * L.cw);
    const d = spr.r + spr.pad;
    const sc = lerp(1, 0.55, k);
    for (const [x0, y0, an] of [[gh.ax, gh.ay, gh.aAngle], [gh.bx, gh.by, gh.bAngle]]) {
      const x = lerp(x0, gh.mx, easeOutCubic(k)), y = lerp(y0, gh.my, easeOutCubic(k));
      g.save();
      g.translate(x, y);
      g.rotate(an);
      g.scale(sc, sc);
      g.globalAlpha = 1 - k * 0.4;
      g.drawImage(spr.cv, -d, -d, d * 2, d * 2);
      g.restore();
    }
    g.globalAlpha = 1;
  }

  let contGrad = null, contGradL = null;
  function drawContainer(theme, t) {
    const g = ctx;
    // interior subtle tint (gradient cached per layout)
    if (!contGrad || contGradL !== L) {
      contGrad = g.createLinearGradient(0, L.yTop, 0, L.yFloor);
      contGrad.addColorStop(0, "rgba(90,160,255,0.03)");
      contGrad.addColorStop(1, "rgba(90,160,255,0.07)");
      contGradL = L;
    }
    g.fillStyle = contGrad;
    g.fillRect(L.x0, L.wallTop, L.cw, L.yFloor - L.wallTop);
    // walls
    g.lineCap = "round";
    const wallGlow = theme.wall;
    for (const [x] of [[L.x0], [L.x1]]) {
      g.strokeStyle = hexA(wallGlow, 0.10);
      g.lineWidth = 9;
      g.beginPath(); g.moveTo(x, L.wallTop); g.lineTo(x, L.yFloor); g.stroke();
      g.strokeStyle = hexA(wallGlow, 0.55);
      g.lineWidth = 2.5;
      g.beginPath(); g.moveTo(x, L.wallTop); g.lineTo(x, L.yFloor); g.stroke();
    }
    // floor
    g.strokeStyle = hexA(wallGlow, 0.1);
    g.lineWidth = 9;
    g.beginPath(); g.moveTo(L.x0, L.yFloor); g.lineTo(L.x1, L.yFloor); g.stroke();
    g.strokeStyle = hexA(wallGlow, 0.6);
    g.lineWidth = 2.5;
    g.beginPath(); g.moveTo(L.x0 - 1, L.yFloor); g.lineTo(L.x1 + 1, L.yFloor); g.stroke();
    // floor glow dots
    g.save();
    g.globalCompositeOperation = "lighter";
    for (let i = 0; i < 7; i++) {
      const x = L.x0 + (i + 0.5) / 7 * L.cw;
      const pulse = 0.5 + 0.5 * Math.sin(t * 0.0016 + i * 1.7);
      g.globalAlpha = 0.05 + pulse * 0.07;
      g.fillStyle = wallGlow;
      g.beginPath(); g.arc(x, L.yFloor + 5, 8, 0, TAU); g.fill();
    }
    g.restore();
    g.globalAlpha = 1;
  }

  function drawDangerLine(theme, t) {
    const g = ctx;
    const w = warnLevel;
    const pulse = 0.5 + 0.5 * Math.sin(t * (0.004 + w * 0.012));
    const alpha = 0.16 + w * 0.75 * (0.6 + 0.4 * pulse);
    const col = w > 0.35 ? "#ff5f6e" : theme.wall;
    // outline-pulse the endangered creatures so the threat reads on the piece itself
    if (w > 0.3) {
      g.save();
      g.globalCompositeOperation = "lighter";
      for (const c of creatures) {
        if (c.overT > 250) {
          g.globalAlpha = 0.35 + 0.45 * pulse;
          g.strokeStyle = "#ff5f6e";
          g.lineWidth = 2.5;
          g.beginPath(); g.arc(c.x, c.y, c.r + 3, 0, TAU); g.stroke();
        }
      }
      g.restore();
      g.globalAlpha = 1;
    }
    g.save();
    g.strokeStyle = hexA(col, alpha);
    g.lineWidth = 2;
    g.setLineDash([9, 8]);
    g.lineDashOffset = -(t * (0.01 + w * 0.05)); // marching ants accelerate with danger
    g.beginPath(); g.moveTo(L.x0 + 3, L.yTop); g.lineTo(L.x1 - 3, L.yTop); g.stroke();
    g.setLineDash([]);
    g.lineDashOffset = 0;
    // end markers
    g.fillStyle = hexA(col, alpha);
    for (const x of [L.x0 + 8, L.x1 - 8]) {
      g.beginPath();
      g.moveTo(x - 5, L.yTop); g.lineTo(x + 5, L.yTop); g.lineTo(x, L.yTop + (x < VW / 2 ? 0 : 0) + 7);
      g.closePath(); g.fill();
    }
    // red vignette when hot (pre-rendered once per layout; alpha animated)
    if (w > 0.4) {
      if (!vigCv || vigCv._w !== VW || vigCv._h !== VH) {
        vigCv = document.createElement("canvas");
        vigCv.width = Math.ceil(VW / 2); vigCv.height = Math.ceil(VH / 2); // half-res is invisible for a soft vignette
        const vgc = vigCv.getContext("2d");
        const vg = vgc.createRadialGradient(VW / 4, VH / 4, VH * 0.175, VW / 4, VH / 4, VH * 0.375);
        vg.addColorStop(0, "rgba(255,60,80,0)");
        vg.addColorStop(1, "rgba(255,40,60,1)");
        vgc.fillStyle = vg;
        vgc.fillRect(0, 0, vigCv.width, vigCv.height);
        vigCv._w = VW; vigCv._h = VH;
      }
      g.globalAlpha = (w - 0.4) * 0.35 * pulse;
      g.drawImage(vigCv, 0, 0, VW, VH);
      g.globalAlpha = 1;
    }
    g.restore();
  }
  let vigCv = null;

  function drawCreature(g, c, x, y, t) {
    const spr = Sprites.get(c.tier, c.r);
    let sc = 1;
    if (c.pop < 1) {
      const p = Math.max(c.pop, 0);
      if (p <= 0) return; // absorb delay: child not visible yet
      sc = p < 0.55 ? lerp(0.1, 1.2, easeOutCubic(p / 0.55)) : lerp(1.2, 1, easeInOutQuad((p - 0.55) / 0.45));
    }
    const breathe = 1 + 0.013 * Math.sin(t * 0.0021 + c.birth % 1000);
    // falling: stretch along velocity for the classic stretch->impact->squash arc
    const fallStretch = (!c.asleep && c.vy > 300 * L.scale) ? clamp(c.vy / (3500 * L.scale), 0, 0.09) : 0;
    const sx = (1 - c.sq * 0.9) * sc * breathe * (1 - fallStretch * 0.6);
    const sy = (1 + c.sq) * sc * (2 - breathe) * (1 + fallStretch);
    g.save();
    g.translate(x, y);
    // squash applied in the impact-axis frame, sprite rotation applied after
    if (c.sqAxis) {
      g.rotate(c.sqAxis);
      g.scale(sx, sy);
      g.rotate(c.angle - c.sqAxis);
    } else {
      g.scale(sx, sy);
      g.rotate(c.angle);
    }
    const d = (spr.r + spr.pad);
    g.drawImage(spr.cv, -d, -d, d * 2, d * 2);
    drawFace(g, c, t);
    g.restore();
  }

  function drawFace(g, c, t) {
    const r = c.r;
    const worried = c.overT > 200 || (c.y - c.r < L.yTop + 40 * L.scale && c.drop && NOW - c.drop > DROP_IMMUNE);
    const joy = c.joyT > 0;
    const blink = c.blinkT < 0 && c.blinkT > -0.12;
    const ex = r * 0.34, ey = -r * 0.14, er = r * 0.15;
    g.fillStyle = "#ffffff";
    for (const sx of [-1, 1]) {
      if (joy) {
        g.strokeStyle = "#123"; g.lineWidth = Math.max(1.2, r * 0.06); g.lineCap = "round";
        g.beginPath(); g.arc(sx * ex, ey, er * 0.85, Math.PI * 1.15, Math.PI * 1.85); g.stroke();
      } else if (blink) {
        g.strokeStyle = "#123"; g.lineWidth = Math.max(1.2, r * 0.06);
        g.beginPath(); g.moveTo(sx * ex - er * 0.7, ey); g.lineTo(sx * ex + er * 0.7, ey); g.stroke();
      } else {
        g.beginPath(); g.arc(sx * ex, ey, er, 0, TAU); g.fill();
        g.fillStyle = "#0b1626";
        const look = clamp(c.vx / 400, -1, 1) * er * 0.3;
        g.beginPath(); g.arc(sx * ex + look, ey + (worried ? -er * 0.15 : er * 0.1), er * 0.52, 0, TAU); g.fill();
        g.fillStyle = "#ffffff";
        g.beginPath(); g.arc(sx * ex + look - er * 0.18, ey - er * 0.15, er * 0.16, 0, TAU); g.fill();
      }
    }
    // brows when worried (mirrored: inner ends raised = canonical worry)
    if (worried && !joy) {
      g.strokeStyle = "#123"; g.lineWidth = Math.max(1.2, r * 0.055);
      for (const sx of [-1, 1]) {
        g.beginPath();
        g.moveTo(sx * (ex - er * 0.7), ey - er * 1.35);
        g.lineTo(sx * (ex + er * 0.7), ey - er * 1.05);
        g.stroke();
      }
    }
    // mouth
    g.strokeStyle = "#123"; g.lineWidth = Math.max(1.2, r * 0.06); g.lineCap = "round";
    if (joy) {
      g.fillStyle = "#1c2a3a";
      g.beginPath(); g.arc(0, r * 0.3, r * 0.16, 0, Math.PI); g.closePath(); g.fill();
    } else if (worried) {
      g.beginPath(); g.arc(0, r * 0.42, r * 0.09, 0, TAU); g.stroke();
    } else {
      g.beginPath(); g.arc(0, r * 0.22, r * 0.16, TAU * 0.06, TAU * 0.44); g.stroke();
    }
  }

  function drawHeld(t) {
    if (!held || state !== "play") return;
    const g = ctx;
    const bobY = Math.sin(held.bob * 3.1) * 3;
    const y = L.yTop - 30 - held.r + bobY; // held piece fully above the danger line
    // aim guide
    if (aiming) {
      let landY = L.yFloor - held.r;
      for (const c of creatures) {
        const dx = Math.abs(c.x - held.x);
        const rs = c.r + held.r;
        if (dx < rs) {
          const ly = c.y - Math.sqrt(Math.max(rs * rs - dx * dx, 0));
          if (ly < landY) landY = ly;
        }
      }
      g.save();
      g.strokeStyle = "rgba(140,210,255,0.22)";
      g.lineWidth = 1.5;
      g.setLineDash([4, 9]);
      g.beginPath(); g.moveTo(held.x, y + held.r + 6); g.lineTo(held.x, landY - 4); g.stroke();
      g.setLineDash([]);
      g.strokeStyle = "rgba(140,210,255,0.18)";
      g.beginPath(); g.arc(held.x, landY, held.r, 0, TAU); g.stroke();
      g.restore();
    }
    const fake = { tier: held.tier, r: held.r, sq: 0, pop: 1, joyT: 0, blinkT: 1, overT: 0, vx: 0, drop: 0, birth: 0, angle: 0, asleep: true, vy: 0 };
    const spawnScale = heldSpawnT < 1 ? easeOutBack(heldSpawnT) : 1;
    g.save();
    g.translate(held.x, y);
    g.scale(spawnScale, spawnScale);
    g.scale(1 + Math.sin(held.bob * 3.1) * 0.012, 1 - Math.sin(held.bob * 3.1) * 0.012);
    const spr = Sprites.get(held.tier, held.r);
    const d = spr.r + spr.pad;
    g.save();
    g.globalCompositeOperation = "lighter";
    g.drawImage(spr.hv, -d, -d, d * 2, d * 2);
    g.restore();
    g.drawImage(spr.cv, -d, -d, d * 2, d * 2);
    drawFace(g, fake, t);
    g.restore();
    // first-time hint (only for genuinely new players)
    if (!firstDropDone && hintT > 0.8 && S.games <= 3) {
      const a = Math.min(1, (hintT - 0.8) / 0.5) * (0.6 + 0.4 * Math.sin(t * 0.004));
      g.globalAlpha = a;
      g.fillStyle = "#9fd8ff";
      g.font = `600 14px ui-rounded, "Segoe UI", system-ui, sans-serif`;
      g.textAlign = "center";
      g.fillText(T.hint, VW / 2, y + held.r + 38);
      const ay = y + held.r + 54 + Math.sin(t * 0.006) * 5;
      g.beginPath();
      g.moveTo(VW / 2 - 6, ay); g.lineTo(VW / 2 + 6, ay); g.lineTo(VW / 2, ay + 8);
      g.closePath(); g.fill();
      g.globalAlpha = 1;
    }
  }

  function buildChainCv(themeIdx) {
    const rBase = 4.4, rStep = 1.35;
    let totalW = 0;
    for (let i = 0; i < 11; i++) totalW += (rBase + i * rStep) * 2 + 7;
    const h = 48;
    chainCv = document.createElement("canvas");
    chainCv.width = Math.ceil(totalW * DPR); chainCv.height = Math.ceil(h * DPR);
    const g = chainCv.getContext("2d");
    g.scale(DPR, DPR);
    let cx = 0;
    const cy = h / 2;
    for (let i = 0; i < 11; i++) {
      const rr = rBase + i * rStep;
      cx += rr;
      const reached = i <= maxTierRun;
      g.globalAlpha = reached ? 1 : 0.28;
      // real creature sprites: the chain reads as a collection, Suika-style
      const spr = Sprites.get(i, rr);
      const d = spr.r + spr.pad;
      g.drawImage(spr.cv, cx - d, cy - d, d * 2, d * 2);
      cx += rr + 7;
    }
    g.globalAlpha = 1;
    chainCv._totalW = totalW; chainCv._h = h;
    chainMaxTier = maxTierRun; chainTheme = themeIdx;
  }

  function drawHud(theme, t) {
    const g = ctx;
    const safeTop = L.safeTop;
    g.textBaseline = "top";
    // score with gain pulse (1 -> 1.22 -> 1, easeOutBack-flavored via scoreFlash)
    const pulse = 1 + 0.22 * easeOutCubic(scoreFlash);
    g.save();
    g.translate(VW / 2, safeTop + 6 + 15);
    g.scale(pulse, pulse);
    g.textAlign = "center";
    g.font = `800 30px ui-rounded, "SF Pro Rounded", "Segoe UI", system-ui, sans-serif`;
    g.fillStyle = "#eaf6ff";
    g.fillText(String(score), 0, -15);
    g.globalCompositeOperation = "lighter";
    g.globalAlpha = 0.35 + scoreFlash * 0.3;
    g.fillStyle = theme.wall;
    g.fillText(String(score), 0, -15);
    g.restore();
    // best (updates live — chasing the record is the loop)
    g.textAlign = "center";
    g.font = `700 12px ui-rounded, "Segoe UI", system-ui, sans-serif`;
    g.fillStyle = "#7fa8c9";
    const bestBase = runIsDaily ? (S.dailyBest.day === dayKey() ? S.dailyBest.score : 0) : S.best;
    const bestVal = Math.max(bestBase, score);
    g.fillStyle = score > 0 && score >= bestBase && bestBase > 0 ? "#ffd678" : "#7fa8c9";
    g.fillText("★ " + bestVal, VW / 2, safeTop + 40);
    // daily badge + streak
    if (runIsDaily) {
      g.font = `800 10px ui-rounded, "Segoe UI", system-ui, sans-serif`;
      g.fillStyle = "#ffd678";
      g.fillText(T.daybadge + (streakN > 1 ? "  🔥" + streakN : ""), VW / 2, safeTop + 56);
    }
    // next preview: the actual creature sprite, readable identity
    const nx = VW - 44, ny = safeTop + 78;
    g.font = `700 10px ui-rounded, "Segoe UI", system-ui, sans-serif`;
    g.fillStyle = "#7fa8c9";
    g.textAlign = "center";
    g.fillText(FR ? "SUIVANT" : "NEXT", nx, ny - 26);
    const pr = 16;
    const spr = Sprites.get(nextTier, pr);
    const pd = spr.r + spr.pad;
    g.save();
    g.globalCompositeOperation = "lighter";
    g.globalAlpha = 0.55;
    g.drawImage(spr.hv, nx - pd, ny + pr - pd, pd * 2, pd * 2);
    g.restore();
    g.globalAlpha = 1;
    g.drawImage(spr.cv, nx - pd, ny + pr - pd, pd * 2, pd * 2);
    g.save();
    g.translate(nx, ny + pr);
    drawFace(g, { tier: nextTier, r: pr, sq: 0, pop: 1, joyT: 0, blinkT: 1, overT: 0, vx: 0, drop: 0, birth: 0, angle: 0, asleep: true, vy: 0 }, t);
    g.restore();
    // combo (during play)
    if (combo >= 2 && state === "play") {
      g.font = `800 ${16 + Math.min(combo * 2, 14)}px ui-rounded, "Segoe UI", system-ui, sans-serif`;
      g.fillStyle = "#ffd678";
      g.textAlign = "left";
      g.fillText("×" + combo, 16, safeTop + 78);
    }
    // evolution chain (cached; only the active-dot glow animates)
    if (!chainCv || chainMaxTier !== maxTierRun || chainTheme !== themeIdx()) buildChainCv(themeIdx());
    const cyBar = VH - 24 - L.safeBottom;
    const tw = chainCv._totalW, chH = chainCv._h;
    const bx = (VW - tw) / 2;
    g.drawImage(chainCv, bx, cyBar - chH / 2, tw, chH);
    if (maxTierRun > 0) {
      // live glow on the highest reached dot
      const rBase = 4.4, rStep = 1.35;
      let cx = bx;
      for (let i = 0; i < maxTierRun; i++) cx += (rBase + i * rStep) * 2 + 7;
      cx += rBase + maxTierRun * rStep;
      const rr = rBase + maxTierRun * rStep;
      const ti = TIERS[maxTierRun];
      const gspr = Sprites.get(maxTierRun, rr);
      const gd = gspr.r + gspr.pad;
      g.save();
      g.globalCompositeOperation = "lighter";
      g.globalAlpha = 0.5 + 0.3 * Math.sin(t * 0.005);
      g.drawImage(gspr.hv, cx - gd, cyBar - gd, gd * 2, gd * 2);
      g.restore();
      g.globalAlpha = 1;
    }
  }

  /* ---------- public ---------- */
  return {
    get creatures() { return creatures; },
    get score() { return score; },
    init() {
      layout();
      reset();
      if (!HEADLESS) requestAnimationFrame(frame);
    },
    tick,
    /* capture/demo hooks — only reachable when the page is opened with ?demo=1 */
    demo: /[?&]demo=1/.test(location.search) ? {
      spawn(tier, x, y, opts) {
        const c = newCreature(tier, x, y, false);
        c.pop = 1;
        if (opts && opts.pop) c.pop = 0;
        creatures.push(c);
        return c;
      },
      setNext(t) {
        nextTier = t;
        if (held) { held.tier = t; held.r = TIERS[t].f * L.cw; }
      },
      setScore(v) { score = v; },
      clear() { creatures.length = 0; ghosts.length = 0; mergeQueue.length = 0; },
      layout() { return L; },
      tiers() { return TIERS; },
      hud() { return { combo, maxTierRun, warn: warnLevel }; },
    } : undefined,
    reset, drop, doContinue, doubleScore,
    setAim(x, isAiming) { aimX = x; aiming = isAiming; },
    releaseAim() { aiming = false; },
    adPause(on) { adPaused = on; },
    pauseForMenu(on) { adPaused = on; },
    rescaleHeld() { if (held) { held.r = TIERS[held.tier].f * L.cw; held.x = clamp(held.x, L.x0 + held.r + 2, L.x1 - held.r - 2); } },
    get state() { return state; },
    get usedContinue() { return usedContinue; },
    get chainCanvas() { return chainCv; },
    relayout: layout,
  };
})();

/* ---------------- UI (DOM overlays) ---------------- */
const UI = (() => {
  const $ = id => document.getElementById(id);
  const ovOver = $("ovOver"), ovMenu = $("ovMenu");
  const btnMute = $("btnMute"), btnMenu = $("btnMenu");
  let deferredPrompt = null;

  function txt() {
    $("ovTitle").textContent = T.gameOver;
    $("btnRestart").textContent = T.restart;
    $("btnDaily").textContent = S.daily ? T.dailyOff : T.dailyBtn;
    $("btnContinue").textContent = Ads.adLabel(T.cont, T.contAd);
    $("btnDouble").textContent = Ads.adLabel(T.dbl, T.dblAd);
    $("lblSound").textContent = T.sound;
    $("lblHaptics").textContent = T.haptics;
    $("lblDaily").textContent = T.daily;
    $("lblTheme").textContent = T.theme;
    $("btnCloseMenu").textContent = T.close;
    $("btnMenuRestart").textContent = T.menuRestart;
    $("btnInstall").textContent = "⬇ " + T.install;
    $("nbBadge").textContent = T.newBest;
  }

  function syncSwitches() {
    $("swSound").classList.toggle("on", S.sound);
    $("swHaptics").classList.toggle("on", S.haptics);
    $("swDaily").classList.toggle("on", S.daily);
    $("lblDaily").textContent = T.daily;
    $("icoSoundOn").style.display = S.sound ? "" : "none";
    $("icoSoundOff").style.display = S.sound ? "none" : "";
    $("menuStats").textContent = T.stats(S.games, S.merges);
    // themes
    const row = $("themeRow");
    row.innerHTML = "";
    // unlocks are a persisted bitmask stamped at toast time (daily-mode runs unlock too)
    let unlockMask = store.get("themesUnlocked", 1);
    THEMES.forEach((th, i) => { if (S.best >= th.need) unlockMask |= 1 << i; }); // legacy migration
    THEMES.forEach((th, i) => {
      const d = document.createElement("div");
      d.className = "theme-dot";
      d.style.background = `linear-gradient(160deg, ${th.bgTop}, ${th.bgBot})`;
      d.style.boxShadow = `inset 0 0 0 2px ${hexA(th.wall, 0.5)}`;
      const locked = !(unlockMask & (1 << i));
      if (locked) d.classList.add("lock");
      if (i === S.theme) d.classList.add("sel");
      const label = document.createElement("span");
      label.textContent = locked ? T.lockAt(th.need) : T.themes[i];
      d.appendChild(label);
      d.addEventListener("click", () => {
        if (locked) { SFX.ui(); return; }
        S.theme = i; store.set("theme", i);
        SFX.ui(); vibe(10);
        syncSwitches();
      });
      row.appendChild(d);
    });
  }

  let countUpRaf = 0;
  function countUp(el, target) {
    cancelAnimationFrame(countUpRaf);
    if (document.hidden) { el.textContent = target; return; }
    const t0 = performance.now();
    const dur = Math.min(600, 150 + target * 2);
    const stepFn = now => {
      const k = clamp((now - t0) / dur, 0, 1);
      el.textContent = Math.round(target * easeOutCubic(k));
      if (k < 1) countUpRaf = requestAnimationFrame(stepFn);
    };
    countUpRaf = requestAnimationFrame(stepFn);
  }
  function showGameOver(score, best, isNew, usedCont, usedDbl) {
    // labels re-resolved here: SDK init is async, so boot-time txt() saw kind="none"
    $("btnContinue").textContent = Ads.adLabel(T.cont, T.contAd);
    $("btnDouble").textContent = Ads.adLabel(T.dbl, T.dblAd);
    countUp($("ovScore"), score);
    $("ovBest").innerHTML = `${T.best} <b>${best}</b>`;
    $("nbBadge").style.display = isNew && score > 0 ? "" : "none";
    // near-miss framing: the genre's retry fuel
    const nm = $("nearMiss");
    if (!isNew && best > 0 && score >= best * 0.6 && score < best) {
      const p = Math.round(score / best * 100);
      $("nearMissTxt").textContent = T.nearMiss(p);
      $("nearMissBar").style.width = "0%";
      nm.style.display = "";
      setTimeout(() => { $("nearMissBar").style.width = p + "%"; }, 150);
    } else nm.style.display = "none";
    $("btnContinue").style.display = usedCont || score === 0 ? "none" : "";
    $("btnDouble").style.display = usedDbl || score === 0 ? "none" : "";
    $("btnDaily").textContent = S.daily ? T.dailyOff : T.dailyBtn;
    ovOver.classList.add("show");
  }
  function refreshOverScore(score, best, isNew) {
    countUp($("ovScore"), score);
    $("ovBest").innerHTML = `${T.best} <b>${best}</b>`;
    if (isNew) $("nbBadge").style.display = "";
    $("nearMiss").style.display = "none";
    $("btnDouble").style.display = "none";
  }
  function hideGameOver() { ovOver.classList.remove("show"); }

  /* events */
  function wire() {
    txt(); syncSwitches();
    btnMute.addEventListener("click", () => {
      S.sound = !S.sound; store.set("sound", S.sound);
      SFX.setMuted(!S.sound); Ads.syncSound(); syncSwitches(); SFX.ui(); vibe(8);
    });
    btnMenu.addEventListener("click", () => {
      SFX.ui(); vibe(8);
      menuBadge(false);
      syncSwitches();
      ovMenu.classList.add("show");
      Game.pauseForMenu(true);
      Ads.gameplayStop();
    });
    $("btnCloseMenu").addEventListener("click", () => {
      SFX.ui(); ovMenu.classList.remove("show"); Game.pauseForMenu(false);
      if (Game.state === "play") Ads.gameplayStart();
    });
    $("btnMenuRestart").addEventListener("click", () => {
      SFX.ui(); ovMenu.classList.remove("show"); Game.pauseForMenu(false);
      Ads.maybeInterstitial("menu_restart", () => { hideGameOver(); Game.reset(); });
    });
    $("swSound").addEventListener("click", () => {
      S.sound = !S.sound; store.set("sound", S.sound);
      SFX.setMuted(!S.sound); Ads.syncSound(); syncSwitches(); SFX.ui();
    });
    $("swHaptics").addEventListener("click", () => {
      S.haptics = !S.haptics; store.set("haptics", S.haptics);
      syncSwitches(); vibe(20); SFX.ui();
    });
    $("swDaily").addEventListener("click", () => {
      S.daily = !S.daily; store.set("daily", S.daily);
      syncSwitches(); SFX.ui();
      // never nuke a live run: mid-game toggles apply on the next dive
      if (Game.state === "play" && Game.score > 0) {
        $("lblDaily").textContent = T.daily + " · " + T.dailyPending;
        return;
      }
      ovMenu.classList.remove("show"); Game.pauseForMenu(false);
      hideGameOver(); Game.reset();
    });
    $("btnDaily").addEventListener("click", () => {
      S.daily = !S.daily; store.set("daily", S.daily);
      SFX.ui(); vibe(10);
      hideGameOver(); Game.reset();
    });
    $("btnRestart").addEventListener("click", () => {
      SFX.ui(); vibe(10);
      Ads.maybeInterstitial("restart", () => {
        hideGameOver(); Game.reset();
      });
    });
    $("btnContinue").addEventListener("click", () => {
      SFX.ui();
      Ads.rewarded("continue", () => { hideGameOver(); Game.doContinue(); },
        () => { });
    });
    $("btnDouble").addEventListener("click", () => {
      SFX.ui();
      Ads.rewarded("double", () => Game.doubleScore(), () => { });
    });
    // install — ONLY when standalone (portals reject install prompts inside their iframe)
    if (Ads.standalone) {
      window.addEventListener("beforeinstallprompt", e => {
        e.preventDefault();
        deferredPrompt = e;
        $("btnInstall").style.display = "";
      });
      $("btnInstall").addEventListener("click", async () => {
        if (!deferredPrompt) return;
        deferredPrompt.prompt();
        await deferredPrompt.userChoice;
        deferredPrompt = null;
        $("btnInstall").style.display = "none";
      });
      // iOS/iPadOS hint (once, after first game over); iPadOS 13+ reports Macintosh
      const ua = navigator.userAgent;
      const isIOS = /iphone|ipad|ipod/i.test(ua) || (/macintosh/i.test(ua) && navigator.maxTouchPoints > 1);
      const standalone = window.matchMedia("(display-mode: standalone)").matches || navigator.standalone;
      if (isIOS && !standalone && !S.iosHintShown) {
        UI.iosHintPending = true;
      }
    }
  }
  function menuBadge(on) {
    btnMenu.style.boxShadow = on
      ? "0 0 0 1px rgba(120,200,255,.14), 0 4px 16px rgba(0,0,0,.4), 0 0 14px rgba(255,214,120,.75)"
      : "";
  }
  function maybeIOSHint() {
    if (!UI.iosHintPending) return;
    UI.iosHintPending = false;
    S.iosHintShown = true; store.set("iosHintShown", true);
    const el = $("iosHint");
    el.innerHTML = T.iosHint;
    el.classList.add("show");
    setTimeout(() => el.classList.remove("show"), 7000);
    el.addEventListener("click", () => el.classList.remove("show"));
  }
  return { wire, showGameOver, refreshOverScore, hideGameOver, maybeIOSHint, menuBadge, iosHintPending: false };
})();

/* ---------------- input ---------------- */
(() => {
  let pointerDown = false;
  canvas.addEventListener("pointerdown", e => {
    e.preventDefault();
    pointerDown = true;
    Game.setAim(e.clientX, true);
  }, { passive: false });
  canvas.addEventListener("pointermove", e => {
    if (pointerDown) Game.setAim(e.clientX, true);
    else if (e.pointerType === "mouse") Game.setAim(e.clientX, false); // desktop hover-aim parity
  });
  window.addEventListener("pointerup", e => {
    if (!pointerDown) return;
    pointerDown = false;
    Game.setAim(e.clientX, false);
    Game.releaseAim();
    Game.drop();
  });
  window.addEventListener("pointercancel", () => {
    pointerDown = false;
    Game.releaseAim();
  });
  canvas.addEventListener("touchmove", e => e.preventDefault(), { passive: false });
  canvas.addEventListener("contextmenu", e => e.preventDefault());
  // iOS pinch-zoom (user-scalable=no is ignored since iOS 10)
  document.addEventListener("gesturestart", e => e.preventDefault());
  document.addEventListener("gesturechange", e => e.preventDefault());
  // keyboard (desktop / accessibility)
  let kbX = null;
  window.addEventListener("keydown", e => {
    if (e.repeat && e.code !== "ArrowLeft" && e.code !== "ArrowRight") return;
    if (kbX === null) kbX = VW / 2;
    if (e.code === "ArrowLeft") { kbX = clamp(kbX - 22, 0, VW); Game.setAim(kbX, true); }
    else if (e.code === "ArrowRight") { kbX = clamp(kbX + 22, 0, VW); Game.setAim(kbX, true); }
    else if (e.code === "Space" || e.code === "ArrowDown") { e.preventDefault(); Game.drop(); }
  });
  // audio unlock (touchend is the reliable iOS trigger)
  const unlock = () => { SFX.unlock(); };
  window.addEventListener("touchend", unlock, { once: true, passive: true });
  window.addEventListener("pointerup", unlock, { once: true });
  window.addEventListener("keydown", unlock, { once: true });
})();

/* ---------------- lifecycle: visibility, wake lock, resize ---------------- */
(() => {
  let wakeLock = null;
  async function requestWake() {
    try {
      if ("wakeLock" in navigator) wakeLock = await navigator.wakeLock.request("screen");
    } catch (e) { }
  }
  window.addEventListener("pointerup", requestWake, { once: true });
  document.addEventListener("visibilitychange", () => {
    if (document.hidden) {
      SFX.suspend();
      Ads.gameplayStop();
    } else {
      SFX.resume();
      requestWake();
      if (Game.state === "play") Ads.gameplayStart();
    }
  });
  let rT = null;
  window.addEventListener("resize", () => {
    clearTimeout(rT);
    rT = setTimeout(() => Game.relayout(), 120);
  });
  window.addEventListener("orientationchange", () => {
    setTimeout(() => Game.relayout(), 250);
  });
})();

/* ---------------- PWA (standalone only — never inside a portal iframe) ---------------- */
if ("serviceWorker" in navigator && !/[?&](headless|nosw)=1/.test(location.search) &&
  window.top === window &&
  (location.protocol === "https:" || location.hostname === "localhost" || location.hostname === "127.0.0.1")) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => { });
  });
}

/* ---------------- boot ---------------- */
document.documentElement.lang = FR ? "fr" : "en";
// migrate legacy theme unlocks once, so a veteran's backlog never bursts as stacked toasts
{
  let mask = store.get("themesUnlocked", 1);
  THEMES.forEach((th, i) => { if (S.best >= th.need) mask |= 1 << i; });
  store.set("themesUnlocked", mask);
}
Ads.init();
UI.wire();
Game.init();
document.addEventListener("visibilitychange", () => {
  if (document.hidden) store.set("merges", S.merges);
});
